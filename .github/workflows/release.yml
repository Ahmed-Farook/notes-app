name: Build & Release (Android, macOS & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Extract Version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://fbkwajfibdbqbzfhaycx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ID7MzXfTFabTtFPApRsYbg_SgpkigOH' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Apple-Notes-${{ steps.meta.outputs.version }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Notes-${{ steps.meta.outputs.version }}-apk
          path: Apple-Notes-${{ steps.meta.outputs.version }}.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Apple Notes $TAG" --notes "Release $TAG for Android and macOS"
          gh release upload "$TAG" Apple-Notes-${{ steps.meta.outputs.version }}.apk --clobber

  build-mac:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Extract Version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://fbkwajfibdbqbzfhaycx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ID7MzXfTFabTtFPApRsYbg_SgpkigOH' }}
        run: npm run build

      - name: Package macOS DMG
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Rename and Prepare DMG
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          find release -name "*.dmg" -exec cp {} "Apple-Notes-${VERSION}-arm64.dmg" \;
          ls -lh Apple-Notes-${VERSION}-arm64.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Notes-${{ steps.meta.outputs.version }}-arm64-dmg
          path: Apple-Notes-${{ steps.meta.outputs.version }}-arm64.dmg

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Apple Notes $TAG" --notes "Release $TAG for Windows, macOS, and Android"
          gh release upload "$TAG" "Apple-Notes-${{ steps.meta.outputs.version }}-arm64.dmg" --clobber

  build-win:
    name: Build Windows Setup EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Extract Version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://fbkwajfibdbqbzfhaycx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ID7MzXfTFabTtFPApRsYbg_SgpkigOH' }}
        run: npm run build

      - name: Package Windows Installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Rename and Prepare EXE
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          find release -name "*.exe" -exec cp {} "Apple-Notes-Setup-${VERSION}.exe" \;
          ls -lh Apple-Notes-Setup-${VERSION}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Notes-${{ steps.meta.outputs.version }}-win-exe
          path: Apple-Notes-Setup-${{ steps.meta.outputs.version }}.exe

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Apple Notes $TAG" --notes "Release $TAG for Windows, macOS, and Android"
          gh release upload "$TAG" "Apple-Notes-Setup-${{ steps.meta.outputs.version }}.exe" --clobber

