<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>texō - Shared Note</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <!-- KaTeX for LaTeX Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <style>
    :root {
      --bg: #FAF6EF;
      --card-bg: #FFFFFF;
      --border: #DFD3C0;
      --text: #1C2B36;
      --text-muted: #5A6E82;
      --accent: #D97706;
      --code-bg: #F7F2EA;
      --pre-border: #DFD3C0;
      --btn-hover: #E5DCCB;
    }

    [data-theme="dark"] {
      --bg: #0F1720;
      --card-bg: #16202A;
      --border: #223344;
      --text: #E8EEF3;
      --text-muted: #8AA0B4;
      --accent: #7EAAD0;
      --code-bg: #121922;
      --pre-border: #223344;
      --btn-hover: #1C2733;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      padding: 0.6rem 1.5rem;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.35rem 0.65rem;
      border-radius: 0.375rem;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--btn-hover);
      color: var(--text);
    }

    .btn-icon {
      padding: 0.35rem;
    }

    main {
      flex: 1;
      max-width: 840px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .note-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .note-content h1 { font-size: 2.25rem; font-weight: 700; margin: 0.35rem 0 0.75rem; letter-spacing: -0.025em; }
    .note-content h2 { font-size: 1.5rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
    .note-content h3 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .note-content p { margin-bottom: 0.85rem; }

    .note-content ul, .note-content ol {
      margin: 0.75rem 0 1rem 1.5rem;
    }

    .note-content pre {
      background-color: var(--code-bg);
      border: 1px solid var(--pre-border);
      padding: 0.85rem 1rem 0.85rem 1.5rem;
      border-radius: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      margin: 1rem 0;
      overflow-x: auto;
    }

    .note-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
    }

    .note-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .drawing-container {
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    .drawing-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .drawing-canvas {
      width: 100%;
      height: auto;
      display: block;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
    }

    footer {
      text-align: center;
      padding: 1.75rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--card-bg);
    }

    @media (max-width: 600px) {
      .note-card { padding: 1.5rem; }
      .note-title { font-size: 1.6rem; }
    }

    @media print {
      header, footer, .header-actions { display: none !important; }
      body { background: #FFFFFF !important; color: #000000 !important; }
      .note-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body>
  <header>
    <a href="./" class="brand">
      <svg width="24" height="24" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 0H78L120 42V92A28 28 0 0 1 92 120H28A28 28 0 0 1 0 92V28A28 28 0 0 1 28 0Z" fill="#263850"/>
        <path d="M78 0L120 42H90A12 12 0 0 1 78 30Z" fill="#4C627E"/>
        <g transform="translate(19.8 27.5) scale(0.58)" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="M52 20V70C52 90 63 101 80 99C90 98 96 92 98 84" stroke="#F5F0E6" stroke-width="15"/>
          <path d="M20 56C44 54 72 44 98 36" stroke="#263850" stroke-width="23"/>
          <path d="M20 56C44 54 72 44 88 37" stroke="#F5F0E6" stroke-width="15"/>
        </g>
      </svg>
      <span>texō</span>
    </a>
    <div class="header-actions">
      <!-- Theme Toggle (Lucide Sun / Moon) -->
      <button class="btn btn-icon" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle theme">
        <svg id="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>

      <!-- Download Button -->
      <button class="btn" id="download-btn" title="Download note (.md)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
        <span>Download</span>
      </button>
    </div>
  </header>

  <main>
    <article class="note-card" id="note-card">
      <h1 class="note-title" id="note-title">Untitled Note</h1>
      <div class="note-content" id="note-content">Loading note...</div>
      
      <div id="drawing-wrapper" class="drawing-container" style="display: none;">
        <div class="drawing-title">Handwritten Sketches &amp; Annotations</div>
        <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
      </div>
    </article>
  </main>

  <footer>
    Shared via <strong>texō</strong>
  </footer>

  <script>
    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && prefersDark);
    
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (isDark) {
        themeIcon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        themeIcon.setAttribute('stroke', 'currentColor');
      } else {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="4" fill="#FACC15" stroke="#FACC15"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
        themeIcon.setAttribute('stroke', '#FACC15');
      }
    }
    applyTheme();

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme();
      renderDrawings();
    });

    let currentNote = { title: '', content: '' };
    let currentStrokes = [];

    // Parse URL params or hash
    function loadSharedData() {
      try {
        let hash = window.location.hash.slice(1);
        let params = new URLSearchParams(hash || window.location.search);

        let title = params.get('title') || 'Untitled Note';
        let contentHtml = params.get('content') || '';
        let strokesRaw = params.get('strokes') || '';

        // If encoded via base64 JSON payload (?share= or #share= or #data=)
        const payloadParam = params.get('share') || params.get('data');
        if (payloadParam) {
          try {
            let str = payloadParam;
            try { str = decodeURIComponent(payloadParam); } catch (_) {}
            const clean = str.replace(/ /g, '+');
            const decoded = decodeURIComponent(escape(atob(clean)));
            const json = JSON.parse(decoded);
            title = json.title || title;
            contentHtml = json.content || contentHtml;
            strokesRaw = json.strokes || strokesRaw;
          } catch (_) {
            try {
              const clean = payloadParam.replace(/ /g, '+');
              const json = JSON.parse(atob(clean));
              title = json.title || title;
              contentHtml = json.content || contentHtml;
              strokesRaw = json.strokes || strokesRaw;
            } catch (__) {}
          }
        }

        currentNote = { title: title, content: contentHtml };

        document.title = `${title} - texō`;

        // Check if content already starts with a heading tag or title to prevent duplicate headings
        const noteTitleEl = document.getElementById('note-title');
        const trimmedContent = (contentHtml || '').trim();
        const hasHeadingInContent = /^<h[1-6][^>]*>/i.test(trimmedContent);
        if (hasHeadingInContent) {
          noteTitleEl.style.display = 'none';
        } else {
          noteTitleEl.textContent = title;
          noteTitleEl.style.display = 'block';
        }

        const contentEl = document.getElementById('note-content');
        contentEl.innerHTML = contentHtml || '<p><em>No text content.</em></p>';

        // Render KaTeX formulas if present
        if (window.renderMathInElement) {
          window.renderMathInElement(contentEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }

        // Render drawings if present
        if (strokesRaw) {
          try {
            currentStrokes = typeof strokesRaw === 'string' ? JSON.parse(strokesRaw) : strokesRaw;
            if (Array.isArray(currentStrokes) && currentStrokes.length > 0) {
              renderDrawings();
            }
          } catch (_) {}
        }
      } catch (err) {
        document.getElementById('note-content').innerHTML = '<p>Unable to load note data from link.</p>';
      }
    }

    // Clean HTML to Markdown converter
    function htmlToMarkdown(html) {
      if (!html) return '';
      const div = document.createElement('div');
      div.innerHTML = html;

      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) return node.textContent || '';
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        const el = node;
        const tag = el.tagName.toLowerCase();
        if (tag === 'br') return '\n';
        if (tag === 'hr') return '\n---\n\n';

        let inner = '';
        el.childNodes.forEach(child => { inner += walk(child); });

        switch (tag) {
          case 'h1': return `# ${inner.trim()}\n\n`;
          case 'h2': return `## ${inner.trim()}\n\n`;
          case 'h3': return `### ${inner.trim()}\n\n`;
          case 'strong': case 'b': return `**${inner}**`;
          case 'em': case 'i': return `*${inner}*`;
          case 'u': return `<u>${inner}</u>`;
          case 's': case 'del': return `~~${inner}~~`;
          case 'code':
            if (el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre') return inner;
            return '`' + inner + '`';
          case 'pre': return '```\n' + inner.replace(/\n+$/, '') + '\n```\n\n';
          case 'blockquote': return inner.replace(/\n+$/, '').split('\n').map(l => '> ' + l).join('\n') + '\n\n';
          case 'li': {
            const checkbox = el.querySelector('input[type="checkbox"]');
            const checked = el.getAttribute('data-checked') === 'true' || Boolean(checkbox && checkbox.checked);
            const isTask = el.getAttribute('data-type') === 'taskItem' || Boolean(checkbox);
            const clean = inner.replace(/\n+$/, '').trim();
            if (isTask) return `- [${checked ? 'x' : ' '}] ${clean}\n`;
            return `- ${clean}\n`;
          }
          case 'ul': case 'ol': return inner.replace(/\n+$/, '') + '\n\n';
          case 'p': case 'div': {
            const clean = inner.replace(/\n+$/, '');
            return clean ? clean + '\n\n' : '\n';
          }
          default: return inner;
        }
      }
      return walk(div).trim();
    }

    // Download Note (.md) handler
    const downloadBtn = document.getElementById('download-btn');
    downloadBtn.addEventListener('click', () => {
      if (!currentNote) return;
      let md = htmlToMarkdown(currentNote.content || '');
      if (currentNote.title && !md.trim().startsWith('#')) {
        md = `# ${currentNote.title}\n\n${md}`;
      }
      const safeTitle = (currentNote.title || 'note').replace(/[/\\?%*:|"<>]/g, '_').trim() || 'note';
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = safeTitle + '.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function renderDrawings() {
      if (!currentStrokes || currentStrokes.length === 0) return;
      const wrapper = document.getElementById('drawing-wrapper');
      const canvas = document.getElementById('drawing-canvas');
      wrapper.style.display = 'block';

      let maxX = 0, maxY = 0;
      for (const s of currentStrokes) {
        for (const p of (s.points || [])) {
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
      }

      const dpr = window.devicePixelRatio || 2;
      const width = Math.max(700, Math.ceil(maxX + 40));
      const height = Math.max(250, Math.ceil(maxY + 40));

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      for (const stroke of currentStrokes) {
        if (!stroke.points || stroke.points.length === 0) continue;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let color = stroke.color || (isDark ? '#E8EEF3' : '#1C2B36');
        if (isDark && (color === '#1C2B36' || color === '#213A50' || color === '#000000')) {
          color = '#E8EEF3';
        } else if (!isDark && (color === '#E8EEF3' || color === '#FFFFFF')) {
          color = '#213A50';
        }

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = stroke.tool === 'highlighter' ? 0.38 : 1;
        ctx.lineWidth = stroke.tool === 'highlighter' ? (stroke.size || 2) * 2.8 : (stroke.size || 2);

        if (stroke.points.length === 1) {
          const p = stroke.points[0];
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1.5, (stroke.size || 2) / 2), 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for (let i = 1; i < stroke.points.length; i++) {
            const prev = stroke.points[i - 1];
            const curr = stroke.points[i];
            ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + curr.x) / 2, (prev.y + curr.y) / 2);
          }
          const last = stroke.points[stroke.points.length - 1];
          ctx.lineTo(last.x, last.y);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    window.addEventListener('DOMContentLoaded', loadSharedData);
    window.addEventListener('hashchange', loadSharedData);
  </script>
</body>
</html>
