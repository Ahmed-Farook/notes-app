<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>texō - Shared Note</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <!-- KaTeX for LaTeX Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <style>
    :root {
      --bg: #FAF6EF;
      --card-bg: #FFFFFF;
      --border: #DFD3C0;
      --text: #1C2B36;
      --text-muted: #5A6E82;
      --accent: #D97706;
      --code-bg: #F7F2EA;
      --pre-border: #DFD3C0;
    }

    [data-theme="dark"] {
      --bg: #0F1720;
      --card-bg: #16202A;
      --border: #223344;
      --text: #E8EEF3;
      --text-muted: #8AA0B4;
      --accent: #7EAAD0;
      --code-bg: #121922;
      --pre-border: #223344;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand img {
      width: 24px;
      height: 24px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.4rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF !important;
      border-color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .note-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .note-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .note-content h1 { font-size: 1.6rem; margin: 1.5rem 0 0.75rem; }
    .note-content h2 { font-size: 1.35rem; margin: 1.25rem 0 0.5rem; }
    .note-content h3 { font-size: 1.15rem; margin: 1rem 0 0.5rem; }
    .note-content p { margin-bottom: 0.85rem; }

    .note-content ul, .note-content ol {
      margin: 0.75rem 0 1rem 1.5rem;
    }

    .note-content ul[data-type="taskList"] {
      list-style: none;
      margin-left: 0;
    }

    .note-content ul[data-type="taskList"] li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }

    .note-content ul[data-type="taskList"] input[type="checkbox"] {
      margin-top: 0.3rem;
      accent-color: var(--accent);
    }

    .note-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .note-content th, .note-content td {
      border: 1px solid var(--border);
      padding: 0.6rem 0.85rem;
      text-align: left;
    }

    .note-content th {
      background: var(--code-bg);
      font-weight: 600;
    }

    .note-content pre {
      background: var(--code-bg);
      border: 1px solid var(--pre-border);
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      margin: 1.25rem 0;
    }

    .note-content code:not(pre code) {
      background: var(--code-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: ui-monospace, monospace;
    }

    .note-content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem 0;
      border: 1px solid var(--border);
    }

    .drawing-container {
      margin-top: 1.5rem;
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
      background: var(--bg);
      padding: 1rem;
      position: relative;
    }

    .drawing-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      .note-card { padding: 1.5rem; }
      .note-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="./" class="brand">
      <img src="./logo.svg" alt="texō">
      <span>texō</span>
    </a>
    <div class="header-actions">
      <button class="btn" id="theme-toggle" title="Toggle theme">🌓 Theme</button>
      <button class="btn" onclick="window.print()" title="Print note">🖨️ Print</button>
      <a href="./" class="btn btn-primary">Get texō</a>
    </div>
  </header>

  <main>
    <article class="note-card" id="note-card">
      <div class="note-meta" id="note-date">Shared Note</div>
      <h1 class="note-title" id="note-title">Untitled Note</h1>
      <div class="note-content" id="note-content">Loading note...</div>
      
      <div id="drawing-wrapper" class="drawing-container" style="display: none;">
        <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
      </div>
    </article>
  </main>

  <footer>
    Made with <strong>texō</strong> — the cross-platform, zero-knowledge note-taking app.
  </footer>

  <script>
    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isDark = localStorage.getItem('texo_public_theme') === 'dark' || (!localStorage.getItem('texo_public_theme') && prefersDark);
    
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }
    applyTheme();

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('texo_public_theme', isDark ? 'dark' : 'light');
      applyTheme();
      renderDrawings();
    });

    let currentStrokes = [];

    // Parse URL params or hash
    function loadSharedData() {
      try {
        let hash = window.location.hash.slice(1);
        let params = new URLSearchParams(hash || window.location.search);

        let title = params.get('title') || 'Untitled Note';
        let contentHtml = params.get('content') || '';
        let strokesRaw = params.get('strokes') || '';

        // If encoded via base64 JSON payload
        if (params.get('data')) {
          try {
            const decoded = decodeURIComponent(escape(atob(params.get('data'))));
            const json = JSON.parse(decoded);
            title = json.title || title;
            contentHtml = json.content || contentHtml;
            strokesRaw = json.strokes || strokesRaw;
          } catch (_) {}
        }

        document.title = `${title} - texō`;
        document.getElementById('note-title').textContent = title;
        document.getElementById('note-date').textContent = `Shared on ${new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;

        const contentEl = document.getElementById('note-content');
        contentEl.innerHTML = contentHtml || '<p><em>No text content.</em></p>';

        // Render KaTeX formulas if present
        if (window.renderMathInElement) {
          window.renderMathInElement(contentEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }

        // Render drawings if present
        if (strokesRaw) {
          try {
            currentStrokes = typeof strokesRaw === 'string' ? JSON.parse(strokesRaw) : strokesRaw;
            if (Array.isArray(currentStrokes) && currentStrokes.length > 0) {
              renderDrawings();
            }
          } catch (_) {}
        }
      } catch (err) {
        document.getElementById('note-content').innerHTML = '<p>Unable to load note data from link.</p>';
      }
    }

    function renderDrawings() {
      if (!currentStrokes || currentStrokes.length === 0) return;
      const wrapper = document.getElementById('drawing-wrapper');
      const canvas = document.getElementById('drawing-canvas');
      wrapper.style.display = 'block';

      let maxX = 0, maxY = 0;
      for (const s of currentStrokes) {
        for (const p of s.points) {
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
      }

      const width = Math.max(700, Math.ceil(maxX + 40));
      const height = Math.max(250, Math.ceil(maxY + 40));

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);

      for (const stroke of currentStrokes) {
        if (!stroke.points || stroke.points.length === 0) continue;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let color = stroke.color;
        // Invert black/white strokes based on dark theme
        if (isDark && (color === '#1C2B36' || color === '#213A50' || color === '#000000')) {
          color = '#E8EEF3';
        } else if (!isDark && (color === '#E8EEF3' || color === '#FFFFFF')) {
          color = '#213A50';
        }

        if (stroke.tool === 'highlighter') {
          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = color;
          ctx.lineWidth = stroke.size * 2;
        } else if (stroke.tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
          ctx.lineWidth = stroke.size * 3;
        } else {
          ctx.globalAlpha = 1;
          ctx.strokeStyle = color;
          ctx.lineWidth = stroke.size;
        }

        const pts = stroke.points;
        if (pts.length === 1) {
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            const prev = pts[i - 1];
            const curr = pts[i];
            const midX = (prev.x + curr.x) / 2;
            const midY = (prev.y + curr.y) / 2;
            ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(last.x, last.y);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    window.addEventListener('DOMContentLoaded', loadSharedData);
  </script>
</body>
</html>
